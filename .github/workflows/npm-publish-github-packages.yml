# This workflow runs tests using Node.js and publishes ShadowStream packages to GitHub Packages
# For more information see: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-npm-registry

name: Publish to GitHub Packages

on:
  release:
    types: [created, published]
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'index.js'
      - 'index.d.ts'
      - 'backend/package.json'
      - 'downloads/streamapp-worker/package.json'
      - '.npmrc'
      - '.github/workflows/npm-publish-github-packages.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@muhdfaisalwork-gif'
      - run: npm ci
      - name: Publish @muhdfaisalwork-gif/shadowstream (Root SDK)
        run: |
          npm publish --registry=https://npm.pkg.github.com/ || echo "Version already published on GitHub Packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @muhdfaisalwork-gif/shadowstream-backend
        working-directory: ./backend
        run: |
          npm publish --registry=https://npm.pkg.github.com/ || echo "Version already published on GitHub Packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @muhdfaisalwork-gif/shadowstream-catalog-worker
        working-directory: ./downloads/streamapp-worker
        run: |
          npm publish --registry=https://npm.pkg.github.com/ || echo "Version already published on GitHub Packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
