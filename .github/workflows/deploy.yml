name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run performance & chaos tests
        working-directory: backend
        run: npx tsx src/tests/perf_and_chaos.test.ts

  build-and-deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            downloads/streamapp-worker/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install worker dependencies
        working-directory: downloads/streamapp-worker
        run: npm ci

      - name: Build frontend for web
        working-directory: frontend
        run: npx expo export -p web

      - name: Deploy Catalog Worker to Cloudflare
        working-directory: downloads/streamapp-worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Frontend to Cloudflare
        working-directory: frontend
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # /api/v1/app-version is served from version.json in the RELEASES bucket,
      # NOT from the Worker bundle. Without this step the published version
      # lags one release behind the code.
      - name: Publish version.json to R2 releases bucket
        working-directory: downloads/streamapp-worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler r2 object put "streamapp-releases/version.json" --file ../frontend/public/version.json --content-type "application/json; charset=utf-8" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # "Build successful" is not "release ready". This gate checks the LIVE
      # site: that the shipped bundle does not sandbox the provider iframe
      # (which is what broke the player in v2.4.39), that no blocked host is
      # served, and that every sampled title still resolves.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify live playback viability
        run: python scripts/verify_streaming_resolution.py

      - name: Summary
        run: |
          echo "✅ Production Build Completed Successfully!"
          echo "Production Domain: https://www.ssmoviestvs.site"
          echo "Catalog API: https://streamapp-catalog.muhd-faisal-work.workers.dev"