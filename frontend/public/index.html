    <style id="expo-reset">
      :root {
        --sat: env(safe-area-inset-top, 0px);

      /* Ensure full-bleed player without scrollbars on mobile */
      .player-fullscreen-lock {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 999999 !important;
        overflow: hidden !important;
      }
    </style>
    <script>
      if (typeof window !== 'undefined' && window.location.search.includes('_v=')) {

          u.searchParams.delete('_v');
          window.history.replaceState({}, document.title, u.pathname + (u.search ? u.search : '') + u.hash);
        } catch (e) {}
      }
